name: Montar distribuição 1.3.7
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  distribuir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e verificar o executável
        shell: bash
        run: |
          set -eu
          cat .distribution/part{0,1,2} > FIELD_TI_1.3.7.exe
          sha256sum -c SHA256SUMS.txt
          git add FIELD_TI_1.3.7.exe
          git rm .distribution/part{0,1,2}
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Disponibiliza o executável verificado da versão 1.3.7'
          git push origin HEAD:main
